name: CI + Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Print environment (helps diagnose runner-only failures)
        run: |
          echo "node $(node -v) · npm $(npm -v) · $(uname -sr)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "node $(node -v) · npm $(npm -v) · $(uname -sr)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + resilience tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/radius-tests.log
        continue-on-error: false

      - name: Surface test output when tests fail
        if: failure()
        run: |
          {
            echo "### Vitest output (failure)"
            echo '```'
            grep -vE "^\s*$" /tmp/radius-tests.log 2>/dev/null | tail -n 90 || echo "no log captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build static bundle
        run: npm run build

      - name: Fail if the bundle references a CDN
        run: |
          if grep -REq 'src="https?://|href="https://cdn|unpkg\.com|jsdelivr\.net|esm\.sh' dist; then
            echo "::error::dist/ references an external script/style host; Pages must serve a self-contained bundle."
            grep -REn 'unpkg\.com|jsdelivr\.net|esm\.sh' dist | head
            exit 1
          fi
          echo "Bundle is self-contained."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.urls.outputs.page_url }}
    steps:
      - id: urls
        run: echo "page_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/deploy-pages@v4
